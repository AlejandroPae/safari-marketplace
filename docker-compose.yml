# Stack local en Docker.
#
#   just db-up        levanta solo Postgres y aplica el esquema
#   just db-shell     abre psql contra la base
#   just db-down      apaga el stack (los datos sobreviven)
#   just db-reset     borra el volumen y empieza de cero
#   just api-docker   Postgres + API en contenedor + su balanceador
#   just stack-up     stack completo: Postgres, API, tienda y admin
#
#   docker compose up -d --scale api=3   tres réplicas de la API detrás de
#                                        api-lb; ver apps/README.md
#
# Estas credenciales son para desarrollo local. En la nube, la cadena de
# conexión se inyecta por la variable DATABASE_URL y nunca se versiona.

services:
  postgres:
    image: postgres:16.14-alpine3.23
    container_name: safari-postgres
    environment:
      POSTGRES_USER: safari
      POSTGRES_PASSWORD: safari
      POSTGRES_DB: safari_scraper
    ports:
      # 5432 es el puerto por defecto de Postgres y suele estar ocupado si
      # ya hay una instalación local. Se expone en 5433 para evitar choques;
      # dentro de la red de Docker el contenedor sigue usando 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safari -d safari_scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Esquema y datos de referencia. Corre lo mismo que
  # `just db-migrate`, con los mismos archivos de db/ (montados, no copiados:
  # una sola fuente de verdad), y termina. Es idempotente, así que se repite
  # en cada `up` sin daño.
  db-init:
    image: postgres:16.14-alpine3.23
    container_name: safari-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: safari
      PGPASSWORD: safari
      PGDATABASE: safari_scraper
    volumes:
      - ./db:/db:ro
    command:
      - sh
      - -c
      - >-
        psql -v ON_ERROR_STOP=1 -q -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" &&
        psql -v ON_ERROR_STOP=1 -q -f /db/schema.sql &&
        psql -v ON_ERROR_STOP=1 -q -f /db/seed.sql &&
        psql -v ON_ERROR_STOP=1 -q -c "VACUUM ANALYZE;" &&
        echo "esquema y datos de referencia aplicados"
    restart: "no"

  # API REST. El desarrollo con hot-reload sigue siendo `just api-dev`
  # (usan el mismo puerto: una u otra).
  #
  # Escalable: sin container_name ni puerto publicado, porque dos
  # réplicas no pueden llamarse igual ni publicar el mismo puerto. Nadie le
  # habla directo: el host, el proxy y el SSR de la tienda pasan por api-lb.
  api:
    build:
      # La raíz, porque la imagen construye también packages/db.
      context: .
      dockerfile: apps/api/rest/Dockerfile
      secrets:
        - extra_ca
    image: safari-api
    # Node como PID 1 ignora SIGTERM (no hay handler) y `docker compose stop`
    # lo mataba a los 10 s con exit 137. tini (init) reenvía la señal.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: "9001"
      # Dentro de la red de compose la base es el servicio `postgres` en su
      # puerto interno, no localhost:5433.
      DATABASE_URL: postgresql://safari:safari@postgres:5432/safari_scraper
      # Valor de desarrollo, como las credenciales de Postgres de arriba. En
      # la nube se inyecta uno real (exportar JWT_SECRET antes de `up`).
      JWT_SECRET: ${JWT_SECRET:-solo-desarrollo-local-no-usar-en-la-nube}
      SHOP_URL: ${SHOP_URL:-http://localhost:3003}
    healthcheck:
      # /api/health/ready consulta la base: sin ella responde 503 y el
      # contenedor pasa a unhealthy, en vez de parecer sano sin datos.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9001/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Balanceador de la API: un Caddy que reparte entre las réplicas de
  # `api` (docker/api-lb.Caddyfile) y publica 9001, así que
  # http://localhost:9001/api sigue siendo la API. SIN depends_on, a propósito:
  # Caddy arranca aunque `api` aún no resuelva, y así ni el proxy ni el SSR de
  # la tienda quedan esperando en un ciclo.
  api-lb:
    image: caddy:2.11.9-alpine
    container_name: safari-api-lb
    volumes:
      - ./docker/api-lb.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "9001:9001"

  # Tienda. Solo la red interna: el navegador entra por `proxy`.
  shop:
    build:
      context: .
      dockerfile: apps/shop/Dockerfile
      secrets:
        - extra_ca
    image: safari-shop
    container_name: safari-shop
    init: true
    depends_on:
      api:
        condition: service_healthy
      api-lb:
        condition: service_started
    environment:
      # SSR/ISR hablan con la API por la red interna, a través del
      # balanceador: así el SSR se reparte entre réplicas y conmuta
      # si una cae, igual que el navegador.
      API_INTERNAL_URL: http://api-lb:9001/api
      # next-auth: la URL pública y, para sus llamadas desde el servidor, la
      # del propio contenedor (localhost:3003 no existe dentro de él).
      NEXTAUTH_URL: http://localhost:3003
      NEXTAUTH_URL_INTERNAL: http://localhost:3000
      SECRET: ${SHOP_SECRET:-solo-desarrollo-local-no-usar-en-la-nube}
      # El optimizador de imágenes descarga las fotos del seed desde S3: tras
      # Zscaler necesita el mismo CA que el build.
      NODE_EXTRA_CA_CERTS: /run/secrets/extra_ca
    secrets:
      - extra_ca
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/en"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Admin. Solo la red interna: el navegador entra por `proxy`.
  admin:
    build:
      context: .
      dockerfile: apps/admin/rest/Dockerfile
      secrets:
        - extra_ca
    image: safari-admin
    container_name: safari-admin
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Enlaces «ver en la tienda», leídos al ejecutar.
      SHOP_URL: ${SHOP_URL:-http://localhost:3003}
      NODE_EXTRA_CA_CERTS: /run/secrets/extra_ca
    secrets:
      - extra_ca
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/en/login"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Reverse proxy: publica la tienda en 3003 y el admin en 3002, y
  # en los dos enruta /backend/* a la API. En el despliegue es el
  # mismo Caddyfile, dentro de la imagen safari-proxy, detrás de Traefik.
  proxy:
    image: caddy:2.11.9-alpine
    container_name: safari-proxy
    depends_on:
      shop:
        condition: service_healthy
      admin:
        condition: service_healthy
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "3003:3003"
      - "3002:3002"

# CA corporativo (ver el Dockerfile de la API): para los builds y para el
# runtime de los frontends. Sin NODE_EXTRA_CA_CERTS en el entorno, el archivo
# vacío de reemplazo no aporta ningún CA y se usan los de siempre.
secrets:
  extra_ca:
    file: ${NODE_EXTRA_CA_CERTS:-./apps/api/rest/no-extra-ca.txt}

volumes:
  postgres-data:
